# Edge reverse proxy — the only published port (80).
#   /auth/*  → Keycloak (upstream IdP), admin + master realm blocked
#   /api/*   → FastAPI (OIDC client + REST API)
#   /*       → static frontend
# Upstreams are resolved at request time (Docker DNS) so Nginx starts even if a service is still down.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 1m;

    # Keycloak / session cookies and headers are large
    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # Keycloak admin console + master realm are never public (use the SSH tunnel)
    location ^~ /auth/admin         { return 403; }
    location ^~ /auth/realms/master { return 403; }

    location /auth/ {
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
    }

    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
    }

    location / {
        set $frontend http://frontend:80;
        proxy_pass $frontend;
    }
}
